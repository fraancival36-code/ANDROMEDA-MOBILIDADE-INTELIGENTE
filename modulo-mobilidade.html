<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobilidade Inteligente — Andrômeda</title>
    <meta name="theme-color" content="#050B18">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif;}
        html, body {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: #050B18;
            color: #E0EFFF;
            padding: 20px 15px 90px;
        }

        .cabecalho {text-align: center; margin-bottom: 20px; border-bottom: 1px solid #00CCFF; padding-bottom: 10px;}
        .titulo {font-size: 20px; font-weight: bold; color: #A064FF;}
        .sub {font-size: 12px; color: #8FB8E8; margin-top: 5px;}

        .bloco {background: #0F1A30; border: 1px solid #203560; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.6;}
        .bloco h4 {color: #00CCFF; margin-bottom: 8px; font-size: 15px;}
        .campo {width: 100%; padding: 10px; margin: 6px 0; background: #050B18; border: 1px solid #203560; border-radius: 8px; color: #E0EFFF; font-size: 14px;}
        .destaque {color: #FFDD66; font-weight: bold;}
        .botao {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #00CCFF;
            color: #050B18;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .botao-secundario {background: #203560; color: #E0EFFF;}
    </style>
</head>
<body>

    <div class="cabecalho">
        <div class="titulo">🚀 MOBILIDADE INTELIGENTE</div>
        <div class="sub">Andrômeda — Segurança e Inteligência em cada trajeto</div>
    </div>

    <div class="bloco">
        <h4>📍 ORIGEM E DESTINO</h4>
        <input type="text" id="origem" class="campo" placeholder="De onde você sai?">
        <input type="text" id="destino" class="campo" placeholder="Para onde vai?">
        <button class="botao" id="btn-calcular">🔍 VER ROTA E VALORES</button>
    </div>

    <div class="bloco">
        <h4>🗺️ DADOS DA VIAGEM</h4>
        <p>Distância: <span id="distancia" class="destaque">-- km</span></p>
        <p>Tempo estimado: <span id="tempo" class="destaque">-- min</span></p>
        <p>Situação: <span id="transito" class="destaque">Verificando...</span></p>
    </div>

    <div class="bloco">
        <h4>🧠 MELHOR OPÇÃO</h4>
        <p>Sugestão da Andrômeda: <span id="melhor-opcao" class="destaque">Aguardando...</span></p>
    </div>

    <a href="index.html" class="botao">🏠 VOLTAR AO INÍCIO</a>

    <!-- NÚCLEO E MÓDULOS — TUDO AQUI POR DENTRO, INVISÍVEL AO USUÁRIO -->
    <script src="andromeda-config.js"></script>
    <script src="andromeda-nucleo-integracao.js"></script>
    <script src="modulos/mapas.js"></script>
    <script src="modulos/seguranca.js"></script>

    <script>
        // Liga a tela ao Núcleo da Andrômeda
        document.getElementById("btn-calcular").addEventListener("click", () => {
            Andromeda.emitirEvento("solicitar_rota", {
                origem: document.getElementById("origem").value,
                destino: document.getElementById("destino").value
            }, Andromeda.prioridade.NAVEGACAO);
        });
    </script>

</body>
</html>
